<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sudoku — Hard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <main class="container py-4">
        <div class="game mx-auto">
            <header class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
                <h1 class="h4 m-0">Sudoku</h1>
                <div class="d-flex align-items-center gap-2">
                    <select id="difficulty" class="form-select form-select-sm" aria-label="Difficulty">
            <option value="30">Medium</option>
            <option value="26" selected>Hard</option>
            <option value="23">Expert</option>
            <option value="21">Extreme</option>
          </select>
                    <button id="newGame" class="btn btn-sm btn-dark">New game</button>
                </div>
            </header>

            <div class="d-flex justify-content-between stats mb-2">
                <span>Time <strong id="timer">00:00</strong></span>
                <span>Mistakes <strong id="mistakes">0</strong>/3</span>
                <span>Hints <strong id="hints">0</strong>/3</span>
            </div>

            <div id="board" class="board" role="grid" aria-label="Sudoku board"></div>

            <div class="d-grid gap-2 mt-3 tools">
                <button id="undo" class="btn btn-outline-secondary btn-sm">Undo</button>
                <button id="erase" class="btn btn-outline-secondary btn-sm">Erase</button>
                <button id="notes" class="btn btn-outline-secondary btn-sm" aria-pressed="false">Notes: off</button>
                <button id="hint" class="btn btn-outline-secondary btn-sm">Hint</button>
            </div>

            <div id="pad" class="pad mt-3"></div>

        </div>
    </main>

    <div class="modal fade" id="endModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content text-center p-3">
                <h2 class="h5" id="endTitle"></h2>
                <p id="endText" class="mb-3"></p>
                <button class="btn btn-dark" id="again" data-bs-dismiss="modal">Play again</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
